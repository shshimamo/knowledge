services:
  # Docker socket権限設定用のinitコンテナ
  init-docker-permissions:
    image: alpine:latest
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: |
      sh -c "
        echo '🐳 Docker socket権限の設定を開始...'
        chgrp 1 /var/run/docker.sock
        echo '✅ Docker socketの権限をdaemonグループ(GID=1)に設定しました'
      "

  # Dev Container - 開発環境用のメインコンテナ
  devcontainer:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    user: "1000:1000"  # vscode user
    volumes:
      - .:/workspaces/knowledge:cached
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspaces/knowledge
    command: sleep infinity
    group_add:
      - "1"  # daemon group (GID=1) for docker.sock access
    depends_on:
      - init-docker-permissions
      - db
    environment:
      - DB_HOST=db
      - DB_PASSWORD=password
      - APP_ENV=development
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:8081
      - NEXT_PUBLIC_MAIN_GQL_URL=http://localhost:8080/query
      - NEXT_PUBLIC_MAIN_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8080:8080"
      - "8081:8081"

  # PostgreSQL Database
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_devcontainer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_devcontainer_data: