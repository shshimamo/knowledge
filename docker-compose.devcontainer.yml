services:
  # Dev Container - 開発環境用のメインコンテナ
  devcontainer:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/knowledge:cached
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspaces/knowledge
    command: sleep infinity
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PASSWORD=password
      - APP_ENV=development
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:8081
      - NEXT_PUBLIC_MAIN_GQL_URL=http://localhost:8080/query
      - NEXT_PUBLIC_MAIN_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8080:8080"
      - "8081:8081"

  # PostgreSQL Database
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_devcontainer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_devcontainer_data: